MODEL:
  PRETRAIN_CHOICE: 'self'
  #PRETRAIN_PATH: "../../.cache/torch/hub/checkpoints" # root of pretrain path
  PRETRAIN_PATH: "/kaggle/working/ReID/models/model_gr_lr_rpt_uam/" 
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  DOMAIN_ADV:
    ENABLED: True
    LAMBDA: 1.0
    HIDDEN_DIM: 256
    DROPOUT: 0.5
    NUM_DOMAINS: 4
  TRANSFORMER_TYPE: 'vit_large_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [224,224]
  SIZE_TEST: [224,224]
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  LGT: # Local Grayscale Transfomation
    DO_LGT: False
    PROB: 0.5
  CJ:
    ENABLED: True
    PROB: 0.5
    BRIGHTNESS: 0.3
    CONTRAST: 0.3
    SATURATION: 0.2
    HUE: 0.1
  REA:
    ENABLED: False
    PROB: 0.5
  RPT:
    ENABLED: True
    PROB: 0.4


DATASETS:
  TRAIN: ('UrbanElementsReID',)
  TEST: ('UrbanElementsReID',)
  #ROOT_DIR: ('../../data') # root of datasets
  ROOT_DIR: '/kaggle/working/ReID/Urban2026'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
  CAMERA_TO_DOMAIN: True

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 20
  BASE_LR: 1e-4 # 0.0004 for msmt
  IMS_PER_BATCH: 48
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 60
  EVAL_PERIOD: 60
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: True

LOG_ROOT: 'models/' # root of log file
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './model_gr_lr_rpt_urban'
